<!DOCTYPE html>
<head>
  <script type="module" src="/static/js/user-card.js"></script>
  <script type="module" src="/static/js/user-page.js"></script>
  <script type="module" src="/static/js/appointment-page.js"></script>
  <script type="module" src="/static/js/appointments-card.js"></script>
	<script type="module" src="/static/js/message-card.js"></script>
	<script type="module" src="/static/js/messages-page.js"></script>
	<script type="module" src="/static/js/response-card.js"></script>
	<script type="module" src="/static/js/responses-page.js"></script>
</head>
<body>
    <style>
        :root {
          --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          --sidebar-width: 280px;
          --primary: #38bdf8;
          --bg-sidebar: #0f172a; /* Deep Navy Background */
          --text-sidebar: #94a3b8;
          --text-sidebar-hover: #ffffff;
          --bg-hover: rgba(255, 255, 255, 0.05);
          --bg-active: rgba(56, 189, 248, 0.15); /* Soft blue tint for active selection */
          --border-color: #1e293b;
        }
            
        body {
            font-family: var(--font-family);
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f8fafc;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.04);
        }

        .sidebar-brand {
            padding: 32px 24px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.025em;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 24px 16px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-sidebar);
            text-align: left;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .nav-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-sidebar-hover);
        }

        .nav-btn.active {
            background-color: var(--bg-active);
            color: var(--primary);
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.2);
        }

        /* Main Content Viewport Styling */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
        }

        .view-container {
            width: 100%;
            height: 100%;
            display: none;
        }

        .view-container.active {
            display: flex;
            flex-direction: column;
        }
    </style>

    <!-- Sidebar Component -->
    <nav class="sidebar">
        <div class="sidebar-brand">CRM App</div>
        <div class="sidebar-nav">
            <button class="nav-btn active" data-target="users" data-component="users-page">Users</button>
            <button class="nav-btn" data-target="appointments" data-component="appointments-page">Appointments</button>
            <button class="nav-btn" data-target="messages" data-component="messages-page">Messages</button>
            <button class="nav-btn" data-target="responses" data-component="responses-page">Responses</button>
        </div>
    </nav>

    <!-- Main Content Dynamic Views -->
    <main class="main-content">
        <div id="view-container" class="view-container active"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navButtons = document.querySelectorAll('.nav-btn');
            const viewContainer = document.getElementById('view-container');

            function renderActivePage(componentTag) {
                viewContainer.innerHTML = '';
                if (componentTag) {
                    const pageElement = document.createElement(componentTag);
                    viewContainer.appendChild(pageElement);
                }
            }

            renderActivePage('users-page');

            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetComponent = button.getAttribute('data-component');

                    navButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    renderActivePage(targetComponent);
                });
            });
        });
    </script>
</body>
</html>
