server.port=5000
# Database URL, Username, and Password
spring.datasource.url=jdbc:postgresql://localhost:7614/crmdb
spring.datasource.username=dbuser
spring.datasource.password=dbuser

# JPA / Hibernate properties
# update: automatically creates or updates tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update
# Shows the exact SQL queries Spring is running in your console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
